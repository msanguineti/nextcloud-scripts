name: Prepare release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Require main
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Select main when running Prepare release.' >&2
            exit 1
          fi

      - name: Check out the selected commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check version is available
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/prepare-release.sh check

  checks:
    name: Validate release
    needs: validate
    uses: ./.github/workflows/ci.yml

  package:
    name: Prepare draft and downloads
    needs: [validate, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out the release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - name: Use protected-tag app when configured
        if: vars.RELEASE_APP_CLIENT_ID != ''
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Build package and create draft release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/prepare-release.sh create
